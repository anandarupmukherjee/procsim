name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: pip install -e ".[test]"
      - name: Unit tests
        run: pytest -q
      - name: Browser engine parity with the Python core
        run: |
          python tests/make_reference.py
          node tests/parity.js
      - name: Installed CLI smoke test
        run: |
          cd "$RUNNER_TEMP"
          procsim --version
          procsim run methanol_loop > /dev/null
          procsim routes
